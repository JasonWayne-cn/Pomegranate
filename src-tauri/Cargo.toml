# ─── Workspace 根 ────────────────────────────────────
# 引入 mcp/ 子 crate 用来构建独立的 kb-mcp.exe（MCP Server sidecar）。
# 主 package（knowledge_base）仍然是 root member，原有 cargo build 行为不变。
# kb-mcp 完全独立、不依赖主包，避免被 cdylib + tauri 牵扯，编译出独立 binary。
[workspace]
# kb-core: 共享 lib，KbDb + KbServer + 12 个工具实现，主应用和 kb-mcp 都依赖它
# mcp: stdio MCP server binary，依赖 kb-core
members = ["kb-core", "mcp"]

[package]
name = "intelligent_notebook"
version = "2.2.0"
description = "智能笔记本桌面应用"
authors = ["wenjq"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "intelligent_notebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ─── Win7 兼容构建 feature ────────────────────────
# 启用后：跳过 tauri-plugin-notification 注册（消除 WinRT 依赖链 A）
# 用法: cargo build --features win7-compat
[features]
win7-compat = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── 跨平台核心依赖（桌面 + 移动端共用）────────────────
# tauri：tray-icon feature 仅桌面端可用，已下移到 target.desktop dependencies

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# functions：注册 kb_word_count() 给字数触发器用（schema v90）
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
# 向量检索 SQLite 扩展（纯 C 静态编译，无 VC++ 运行时绑定，Win7 兼容）
sqlite-vec = "0.1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-process = "2"
# reqwest：移动端 NDK 不带 OpenSSL，统一用 rustls-tls（桌面端也能用，行为一致；
# 系统证书池靠 rustls-native-certs 加载，避免迁移成本）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "net", "rt", "rt-multi-thread", "time"] }
# T-024b S3 协议 backend：rust-s3 0.34 即使开 tokio-rustls-tls 也强制带 native-tls/openssl
# 链接，移动端 NDK 不带 OpenSSL 编译失败 → 整段移到 target.desktop dependencies
# 移动端按 T-M014 计划改"手动同步 + 仅 WebDAV/local"，等 rust-s3 修了 features 隔离再启用
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
tauri-plugin-dialog = "2"
walkdir = "2"
pulldown-cmark = "0.13.1"
html2md = "0.2"
# T-009 OB 整库导入：解析 markdown 头部 YAML frontmatter（tags / aliases / 等）
serde_yml = "0.0.12"
# T-009 OB 整库导入：识别 markdown / OB-wiki 形式的图片引用（`![](...)` / `![[...]]`）
regex = "1"
base64 = "0.22.1"
# 更新包验签：按 tauri updater 的 minisign 格式校验下载产物（install() 本身不验签）
minisign-verify = "0.2"
bytes = "1"
pdf-extract = "0.9"
# ─── 同步功能 ────────────────────────────────────
zip = "2.2"
quick-xml = { version = "0.37", features = ["encoding"] }
sha2 = "0.10"
hostname = "0.4"
urlencoding = "2"
aes-gcm = "0.10"
# 扩展包离线签名验证（Ed25519，纯 Rust，无平台依赖）
ed25519-dalek = "2"
# T-007 笔记加密：Argon2id 密码派生 + zeroize 在 drop 时清零敏感内存；rand 生成盐/nonce
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.8"
# T-027 .txt 导入：很多旧 txt 是 GBK / GB18030 / Big5，必须先嗅探编码再转 UTF-8
# chardetng / encoding_rs 是纯 Rust 编码识别工具，移动端可编译
chardetng = "0.1"
encoding_rs = "0.8"
# kb-core: 共享的 MCP server 实现（KbDb + KbServer + 12 工具），
# 主应用在进程内 spawn KbServer，让自家 AI 对话页通过 MCP 协议消费同一套工具
kb-core = { path = "kb-core" }
# rmcp client：in-memory transport 调用同进程 KbServer（双端通用）
# transport-child-process 仅桌面端用（spawn 外部 MCP server），移到 target.desktop
rmcp = { version = "1.5", features = ["client"] }
# ─── KB 2.0 合并：模型服务 / S3 / 数据集 / 网页正文提取 ─────
# ai-profile：模型预置、协议拼写、端点拼接、限额与 ai.profile 协议
ai-profile = { version = "0.1.7", features = ["chat", "client"] }
# 纯 Rust SigV4 签名，零 HTTP/TLS 依赖（KB sync_v1 的 S3 backend 使用）
rusty-s3 = "0.10"
# Excel/CSV 二维数据集导入
csv = "1"
# 网页正文提取（Readability 算法，替代已停更的 readability crate）
dom_smoothie = "0.18"
# dom_smoothie 同源 DOM 操作库，保证依赖版本一致
dom_query = "0.28"
# Excel / ODS 解析、Word 导出、txt 编码识别 — 双端通用纯 Rust 工具
# 这些在原文件上面已声明 calamine / docx-rs / chardetng / encoding_rs 等，保持位置不变

# ─── 局域网同步（桌面当主机；手机端只用客户端；L5 手机当主机也用同一套）────
# 自签证书 + 指纹固定校验：与 reqwest 用同一个 rustls 0.23 + ring，不引入第二套加密后端
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# axum::serve 不带 TLS：用 tokio-rustls 接 TLS、hyper-util 把 Router 接到每条 TLS 连接上
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "http1", "tokio", "service"] }
hyper = { version = "1", features = ["server", "http1"] }
# 服务端（MCP HTTP 与局域网同步共用）
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
# 列出本机所有局域网 IPv4 给配对二维码（多网卡 / VPN 时不只一个）
if-addrs = "0.15"
# mDNS 广播 / 发现：换 IP 后手机按证书指纹找回电脑
mdns-sd = "0.21"

# ─── 桌面专属依赖（cfg(desktop) 编译时启用；移动端不引入）────
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# 系统托盘 feature
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# 桌面专属插件
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# 系统字体枚举（Windows=DirectWrite / macOS=CoreText / Linux=fontconfig，无 C 依赖）
font-enumeration = "0.9"
# 字体度量（ascender/descender/advance），纯 Rust，用于 DOCX 分页估算
ttf-parser = "0.25"
# PDFium fallback（pdf-extract 对中文 CMap 不支持，运行时动态加载 pdfium.dll 兜底）
# 移动端 NDK 加载动态库受沙盒限制，暂不支持，待 T-M012 决策
pdfium-render = "0.8"
# PDF 图片抽取：DynamicImage 解码后统一转 PNG（版本与 pdfium-render 传递依赖一致）
image = { version = "0.25", default-features = false, features = ["png"] }
# rmcp 桌面端额外能力：spawn 外部 MCP server 子进程（移动端 fork/spawn 受限）
rmcp = { version = "1.5", features = [
    "transport-child-process",
    "transport-streamable-http-server",
] }
# rust-s3 S3 协议 backend：rust-s3 0.34 强引入 openssl，移动端编译失败
rust-s3 = { version = "0.34", default-features = false, features = ["tokio-rustls-tls"] }
# Excel / ODS 解析（calamine 在 Android target 编译失败，先桌面端独享；
# 移动端按 T-M013 改单文件导入流程后再决策）
calamine = "0.28"
# xlsx 单元格编辑（Office Spike）；纯 Rust，桌面端独享
umya-spreadsheet = "1"
# T-020 笔记导出为 Word（docx-rs 在 Android target 编译失败，先桌面端独享；
# 移动端按 T-M013 后再决策）
docx-rs = "0.4"
# 本地离线语音识别：引擎与模型都在运行时按需下载，不进入安装包。
# 引擎用 sherpa-onnx 官方预编译 CLI（tar.bz2），因此只需解压依赖，
# 不引入 onnxruntime 编译期依赖（sherpa-rs 需要本机 libclang）。
tar = "0.4"
bzip2 = "0.4"

# ─── Windows 专属：窗口位置记忆的 Win32 消息 ─────────────
# WM_DISPLAYCHANGE / WM_ENTERSIZEMOVE 需要子类化窗口过程；GetDpiForWindow
# 用来把 WebView 的渲染比例同步成窗口实际缩放（见 src/window_memory/glue.rs）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

# ─── Android 专属 ────────────────────────────────
# APK 安装 / 局域网 mDNS 组播锁都需要 JNI 调应用自有 Kotlin 类
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# ─── 编译优化 ────────────────────────────────────

[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# 注意：不能设置 panic = "abort"，否则 html2md 的子依赖会因 panic 策略冲突编译失败
